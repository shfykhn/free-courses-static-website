===============================

  <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"
        aria-current="true" aria-label="Slide 1"></button>
      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"
        aria-label="Slide 2"></button>
      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"
        aria-label="Slide 3"></button>
    </div>
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="./asset/graphic.jpg" class="d-block w-100" alt="bg">
      </div>

    </div>

  </div>



  <!-- ===============================
===============================
=============================== -->




  <div class="container mt-5">
    <div class="card shadow-lg p-4 rounded custom-card">
      <h2 class="text-center mb-4">Feedback Form</h2>
      <form action="/">
        <!-- Username -->
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control" id="username" placeholder="Enter your username" required>
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
        </div>

        <!-- Phone -->
        <div class="mb-4">
          <label for="phone" class="form-label">Phone Number</label>
          <input type="number" class="form-control" id="phone" placeholder="03xx 12345678" required>
        </div>

        <!-- Submit Button -->
        <div class="text-center">
          <button type="submit" class="btn custom-btn">Submit Feedback</button>
        </div>
      </form>
    </div>
  </div>
